<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-Do List</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .container {
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 500px;
    padding: 32px;
  }

  h1 {
    color: #333;
    margin-bottom: 8px;
    font-size: 28px;
  }

  .subtitle {
    color: #999;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input[type="text"]:focus {
    border-color: #667eea;
  }

  input[type="text"]::placeholder {
    color: #ccc;
  }

  button {
    padding: 12px 24px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.05s ease;
  }

  button:hover {
    background: #5568d3;
  }

  button:active {
    transform: scale(0.98);
  }

  button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 8px 14px;
    background: #f0f0f0;
    color: #666;
    border: 2px solid transparent;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filter-btn.active {
    background: #667eea;
    color: white;
    border-color: #667eea;
  }

  .filter-btn:hover {
    border-color: #667eea;
  }

  .todo-list {
    max-height: 500px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: #f9f9f9;
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: all 0.2s ease;
  }

  .todo-item:hover {
    background: #f5f5f5;
    border-color: #d0d0d0;
  }

  .todo-item.completed {
    opacity: 0.6;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #999;
  }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #667eea;
  }

  .todo-text {
    flex: 1;
    color: #333;
    font-size: 14px;
    word-break: break-word;
  }

  .todo-priority {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    margin-right: 8px;
  }

  .priority-high {
    background: #fecaca;
    color: #991b1b;
  }

  .priority-medium {
    background: #fef3c7;
    color: #92400e;
  }

  .priority-low {
    background: #d1fae5;
    color: #065f46;
  }

  .delete-btn {
    padding: 6px 12px;
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .delete-btn:hover {
    background: #dc2626;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #999;
  }

  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .empty-state-text {
    font-size: 14px;
    margin-bottom: 4px;
  }

  .stats {
    display: flex;
    gap: 16px;
    padding: 16px;
    background: #f9f9f9;
    border-radius: 8px;
    margin-top: 24px;
    font-size: 13px;
    color: #666;
    border: 1px solid #e8e8e8;
  }

  .stat {
    flex: 1;
    text-align: center;
  }

  .stat-number {
    display: block;
    font-size: 20px;
    font-weight: 700;
    color: #667eea;
  }

  .stat-label {
    display: block;
    font-size: 12px;
    margin-top: 4px;
  }

  .clear-all-btn {
    width: 100%;
    margin-top: 16px;
    background: #ef4444;
    padding: 12px;
  }

  .clear-all-btn:hover {
    background: #dc2626;
  }

  @media (max-width: 480px) {
    .container {
      padding: 20px;
    }

    h1 {
      font-size: 24px;
    }

    .input-group {
      flex-direction: column;
    }

    button {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📝 My Tasks</h1>
  <p class="subtitle">Organize your day with ease</p>

  <div class="input-group">
    <input type="text" id="todoInput" placeholder="Add a new task..." />
    <select id="prioritySelect" style="padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; cursor: pointer; outline: none;">
      <option value="low">Low</option>
      <option value="medium" selected>Normal</option>
      <option value="high">High</option>
    </select>
    <button id="addBtn">Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
    <button class="filter-btn" data-filter="high">High Priority</button>
  </div>

  <div class="todo-list" id="todoList"></div>

  <div class="stats">
    <div class="stat">
      <span class="stat-number" id="totalCount">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="activeCount">0</span>
      <span class="stat-label">Active</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="completedCount">0</span>
      <span class="stat-label">Completed</span>
    </div>
  </div>

  <button class="clear-all-btn" id="clearAllBtn">Clear Completed</button>
</div>

<script>
(function () {
  const STORAGE_KEY = 'todos';
  let todos = [];
  let currentFilter = 'all';

  // Initialize
  function init() {
    loadTodos();
    setupEventListeners();
    render();
  }

  // Load todos from localStorage
  function loadTodos() {
    const stored = localStorage.getItem(STORAGE_KEY);
    todos = stored ? JSON.parse(stored) : [];
  }

  // Save todos to localStorage
  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  // Setup event listeners
  function setupEventListeners() {
    const addBtn = document.getElementById('addBtn');
    const todoInput = document.getElementById('todoInput');

    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addTodo();
    });

    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        render();
      });
    });

    document.getElementById('clearAllBtn').addEventListener('click', clearCompleted);
  }

  // Add a new todo
  function addTodo() {
    const input = document.getElementById('todoInput');
    const priority = document.getElementById('prioritySelect').value;
    const text = input.value.trim();

    if (!text) {
      input.focus();
      return;
    }

    const todo = {
      id: Date.now(),
      text: text,
      completed: false,
      priority: priority,
      createdAt: new Date().toISOString()
    };

    todos.unshift(todo);
    saveTodos();
    input.value = '';
    input.focus();
    render();
  }

  // Toggle todo completion
  function toggleTodo(id) {
    const todo = todos.find(function (t) { return t.id === id; });
    if (todo) {
      todo.completed = !todo.completed;
      saveTodos();
      render();
    }
  }

  // Delete todo
  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    saveTodos();
    render();
  }

  // Clear completed todos
  function clearCompleted() {
    if (todos.some(function (t) { return t.completed; })) {
      if (confirm('Delete all completed tasks?')) {
        todos = todos.filter(function (t) { return !t.completed; });
        saveTodos();
        render();
      }
    }
  }

  // Filter todos
  function getFilteredTodos() {
    switch (currentFilter) {
      case 'active':
        return todos.filter(function (t) { return !t.completed; });
      case 'completed':
        return todos.filter(function (t) { return t.completed; });
      case 'high':
        return todos.filter(function (t) { return t.priority === 'high'; });
      default:
        return todos;
    }
  }

  // Get stats
  function getStats() {
    return {
      total: todos.length,
      active: todos.filter(function (t) { return !t.completed; }).length,
      completed: todos.filter(function (t) { return t.completed; }).length
    };
  }

  // Render
  function render() {
    const todoList = document.getElementById('todoList');
    const filtered = getFilteredTodos();
    const stats = getStats();

    // Render todo list
    if (filtered.length === 0) {
      todoList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✨</div><div class="empty-state-text">No tasks yet</div></div>';
    } else {
      todoList.innerHTML = filtered.map(function (todo) {
        return '<div class="todo-item ' + (todo.completed ? 'completed' : '') + '">' +
          '<input type="checkbox" ' + (todo.completed ? 'checked' : '') + ' onchange="window.toggleTodo(' + todo.id + ')" />' +
          '<span class="todo-priority priority-' + todo.priority + '">' + todo.priority + '</span>' +
          '<span class="todo-text">' + escapeHtml(todo.text) + '</span>' +
          '<button class="delete-btn" onclick="window.deleteTodo(' + todo.id + ')">Delete</button>' +
        '</div>';
      }).join('');
    }

    // Render stats
    document.getElementById('totalCount').textContent = stats.total;
    document.getElementById('activeCount').textContent = stats.active;
    document.getElementById('completedCount').textContent = stats.completed;

    // Expose functions globally for onclick
    window.toggleTodo = toggleTodo;
    window.deleteTodo = deleteTodo;
  }

  // Escape HTML to prevent XSS
  function escapeHtml(text) {
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, function (m) { return map[m]; });
  }

  // Start the app
  init();
})();
</script>
</body>
</html>
